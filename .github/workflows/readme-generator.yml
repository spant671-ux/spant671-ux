name: Readme Generator
on:
  schedule: [{cron: '0 0 * * *'}]
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📊 Left Panel - Profile & Calendar & Stars
        uses: lowlighter/metrics@latest
        with:
          filename: assets/left.svg
          token: ${{ secrets.GH_TOKEN }}
          user: spant671-ux
          base: header
          base_indepth: yes
          config_order: base.header, isocalendar, stars
          plugin_isocalendar: yes
          plugin_stars: yes
          plugin_stars_limit: 3

      - name: 📊 Right Panel - Languages, Habits & Code
        uses: lowlighter/metrics@latest
        with:
          filename: assets/right.svg
          token: ${{ secrets.GH_TOKEN }}
          user: spant671-ux
          base: ""
          config_timezone: Asia/Kolkata
          config_order: languages, habits, lines
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: rainbow
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_facts: yes
          plugin_habits_days: 14
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 3
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30

      - name: 📊 Bottom Panel - Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/achievements.svg
          token: ${{ secrets.GH_TOKEN }}
          user: spant671-ux
          base: ""
          config_timezone: Asia/Kolkata
          config_order: achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
