name: Waka Readme

on:
  schedule:
    - cron: '30 18 * * *'   # Runs daily at midnight IST (18:30 UTC)
  workflow_dispatch:         # Allows manual trigger from Actions tab

jobs:
  update-readme:
    name: Update Readme with Waka Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LANGUAGE: "False"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_EDITORS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_UPDATED_DATE: "True"
          COMMIT_BY_ME: "True"
          LOCALE: "en"
          SYMBOL_VERSION: "3"
          SHOW_TOTAL_CODE_TIME: "False"

      - name: Pull, Update Title to Busy Bee, and Push
        run: |
          git pull origin main
          python -c "
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('**I\'m an Early 🐤**', '**I\'m a Busy Bee 🐝**')
          content = content.replace('**I\'m a Night 🦉**', '**I\'m a Busy Bee 🐝**')
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          git config --global user.name 'spant671'
          git config --global user.email 'spant671@gmail.com'
          git add README.md
          git diff-index --quiet HEAD || git commit -m 'style: update chronotype title to Busy Bee'
          git push origin main
